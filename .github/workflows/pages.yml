name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Проверки и сборка
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Получить код
        uses: actions/checkout@v7.0.1
      - name: Установить Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Запустить тесты
        run: npm test
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Собрать приложение
        run: npm run build:pages
      - name: Загрузить сборку
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    name: Опубликовать сайт
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
